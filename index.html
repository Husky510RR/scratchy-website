<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Scratchy</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <div id="stato-caricamento">
      <p>Caricamento...</p>
    </div>

    <div id="stato-errore" class="nascosto">
      <p>Questo grattino non esiste più 😢</p>
    </div>

    <div id="stato-grattino" class="nascosto">
      <p id="eyebrow" class="eyebrow">Hai ricevuto un</p>
      <h1>Scratchy 🎁</h1>
      <p id="istruzioni" class="istruzioni">Gratta con il dito per scoprire cosa c'è sotto</p>

      <div id="contenitore-canvas">
        <canvas id="canvas-scratch"></canvas>
        <div id="contenuto-sotto"></div>
      </div>

      <div id="cta-download" class="nascosto">
        <button id="btn-salva-foto" class="bottone-secondario">Scarica foto</button>
        <p>Ti è piaciuto? Crea il tuo Scratchy!</p>
        <a href="https://apps.apple.com" id="link-store" class="bottone-cta">Scarica l'app</a>
      </div>
    </div>
  </div>

  <script src="scratch.js"></script>
</body>
</html>
